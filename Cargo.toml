[package]
name = "cloudyday"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20 = "0.10.0"
hkdf = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
domain = { version = "0.12.3", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
